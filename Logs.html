<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>內部人員登入</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #f8fafc; 
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08); width: 320px;
        }
        h1 { color: #007bff; margin: 0 0 20px 0; font-size: 1.3rem; }
        input {
            width: 100%; padding: 12px; margin-bottom: 12px;
            border: 1px solid #e2e8f0; border-radius: 8px; 
            box-sizing: border-box; font-size: 0.95rem;
        }
        button {
            width: 100%; padding: 12px; background: #007bff; color: white;
            border: none; border-radius: 8px; font-size: 1rem; 
            font-weight: 600; cursor: pointer;
        }
        button:hover { background: #0056b3; }
        .err { color: #e53e3e; font-size: 0.85rem; margin-top: 10px; min-height: 20px; }
        .back { display: block; text-align: center; margin-top: 15px; 
                color: #64748b; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔒 內部人員登入</h1>
        <input type="email" id="email" placeholder="Email" autocomplete="email">
        <input type="password" id="password" placeholder="密碼" autocomplete="current-password">
        <button onclick="login()">登入</button>
        <div class="err" id="err"></div>
        <a href="index.html" class="back">← 返回地圖</a>
    </div>

    <script src="./config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('err');
            errEl.textContent = '';

            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            
            if (error) {
                errEl.textContent = '登入失敗:' + error.message;
                return;
            }
            // 登入成功 → 跳到 Logs.html
            window.location.href = 'Logs.html';
        }

        // Enter 鍵也能送出
        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
